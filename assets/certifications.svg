<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Verified Deployments &amp; Engineering Milestones</title>
  <desc id="ce-d">Google Play published apps: FIZI and SplitPlan. B.E. in Computer Science at KMEC Hyderabad. Machine Learning from scratch in pure NumPy. Multi-agent consensus LLM architecture.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1B14"/><stop offset="1" stop-color="#08110C"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#1F5A45" stop-opacity=".5"/><stop offset="1" stop-color="#08110C" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F6F1"/><stop offset=".5" stop-color="#A7D8BD"/><stop offset="1" stop-color="#438B6B" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: "Cinzel", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ce-tile { animation: ce-in 1s cubic-bezier(.34,1.3,.64,1) both; }
    .ce-edge { stroke-dasharray: 870; stroke-dashoffset: 870; animation: ce-edge 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes ce-edge { 0% { stroke-dashoffset: 870; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 60%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-tile { animation: none; } .ce-edge { display: none; } }
  </style>
