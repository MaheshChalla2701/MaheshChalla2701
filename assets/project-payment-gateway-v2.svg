<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">SplitPlan: Group expense sharing and collaborative trip planning app on Google Play.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B14"/><stop offset="1" stop-color="#08110C"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1F5A45" stop-opacity=".7"/><stop offset="1" stop-color="#0D1B14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#438B6B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F6F1"/><stop offset=".45" stop-color="#A7D8BD"/><stop offset="1" stop-color="#438B6B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: "Cinzel", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#438B6B">02 · MOBILE · COLLABORATIVE · GOOGLE PLAY · SHIPPED</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F3F6F1">SplitPlan</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#AABDB2">Smart expense-sharing and collaborative trip itinerary manager for groups.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#A7D8BD"><tspan fill="#438B6B">BUILT ›</tspan> Minimalist balance simplification, offline caching, real-time shared budget ledger</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#438B6B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F3F6F1">PLAY STORE</text><text class="p2-sans" y="24" font-size="12.5" fill="#AABDB2">active Android users</text></g>
      <g transform="translate(261 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F3F6F1">MIN-TRANSACTIONS</text><text class="p2-sans" y="24" font-size="12.5" fill="#AABDB2">debt simplification algorithm</text></g>
      <g transform="translate(466 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F3F6F1">OFFLINE-FIRST</text><text class="p2-sans" y="24" font-size="12.5" fill="#AABDB2">local cache with auto-sync</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p2-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Flutter</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="55" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p2-mono" x="161" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Dart</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="197" y="314" width="75" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p2-mono" x="234" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Firebase</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="280" y="314" width="75" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p2-mono" x="317" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Riverpod</text></g>
      <g class="p2-chip" style="animation-delay:1.48s"><rect x="363" y="314" width="135" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p2-mono" x="430" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Google Play Live</text></g>
    </g>
    <g class="p2-in p2-d2"><g transform="translate(0 35)">
      <g transform="translate(870 30)">
        <rect x="0" y="0" width="180" height="240" rx="20" fill="#0D1B14" stroke="#438B6B" stroke-opacity=".4" stroke-width="2"/>
        <rect x="12" y="14" width="156" height="40" rx="10" fill="#163326" stroke="#438B6B" stroke-opacity=".2"/>
        <text class="p2-mono" x="24" y="32" font-size="10" fill="#438B6B">GOA TRIP 2026</text>
        <text class="p2-serif" x="24" y="48" font-size="14" fill="#F3F6F1">Total: ₹34,250</text>
        
        <g transform="translate(16 70)">
          <rect width="148" height="40" rx="8" fill="#163326" stroke="#438B6B" stroke-opacity=".25"/>
          <text class="p2-mono" x="12" y="18" font-size="9.5" fill="#AABDB2">Villa Booking</text>
          <text class="p2-mono" x="12" y="32" font-size="11" fill="#F3F6F1">Mahesh paid ₹18,000</text>
        </g>
        <g transform="translate(16 118)">
          <rect width="148" height="40" rx="8" fill="#163326" stroke="#438B6B" stroke-opacity=".25"/>
          <text class="p2-mono" x="12" y="18" font-size="9.5" fill="#AABDB2">Dinner &amp; Fuel</text>
          <text class="p2-mono" x="12" y="32" font-size="11" fill="#F3F6F1">Rahul owes you ₹4,500</text>
        </g>

        <rect x="12" y="174" width="156" height="50" rx="10" fill="#1F5A45" fill-opacity=".4" stroke="#438B6B" stroke-opacity=".4"/>
        <text class="p2-mono" x="24" y="194" font-size="9.5" fill="#A7D8BD">OPTIMIZED SETTLEMENT</text>
        <text class="p2-sans" x="24" y="210" font-size="11" fill="#F3F6F1">3 payments clear all 5 users</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#438B6B" stroke-opacity=".2"/>
    <rect class="p2-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

