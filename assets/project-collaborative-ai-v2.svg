<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">Collaborative AI: Multi-LLM consensus and debate council system.</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B14"/><stop offset="1" stop-color="#08110C"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1F5A45" stop-opacity=".7"/><stop offset="1" stop-color="#163326" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#438B6B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p3-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F6F1"/><stop offset=".45" stop-color="#A7D8BD"/><stop offset="1" stop-color="#438B6B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: "Cinzel", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-in, .p3-chip { animation: none; } .p3-draw { animation: none; stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-trace { display: none; } }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#438B6B">03 · AI AGENTS · FASTAPI · MULTI-LLM · ARCHITECTURE</text>
      <text class="p3-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F3F6F1">Collaborative AI</text>
      <text class="p3-sans" x="56" y="166" font-size="17" fill="#AABDB2">Multi-LLM consensus platform orchestrating collaborative debate between leading models.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#A7D8BD"><tspan fill="#438B6B">BUILT ›</tspan> FastAPI async streaming, peer review arbitration, React live council UI</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#438B6B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F3F6F1">3+ AGENTS</text><text class="p3-sans" y="24" font-size="12.5" fill="#AABDB2">GPT-4, Claude, Gemini</text></g>
      <g transform="translate(261 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F3F6F1">CONSENSUS</text><text class="p3-sans" y="24" font-size="12.5" fill="#AABDB2">blind cross-model critique</text></g>
      <g transform="translate(466 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F3F6F1">STREAMING</text><text class="p3-sans" y="24" font-size="12.5" fill="#AABDB2">low-latency async responses</text></g>
      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p3-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">FastAPI</text></g>
      <g class="p3-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="65" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p3-mono" x="166" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Python</text></g>
      <g class="p3-chip" style="animation-delay:1.24s"><rect x="207" y="314" width="60" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p3-mono" x="237" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">React</text></g>
      <g class="p3-chip" style="animation-delay:1.36s"><rect x="275" y="314" width="75" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p3-mono" x="312" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Firebase</text></g>
      <g class="p3-chip" style="animation-delay:1.48s"><rect x="358" y="314" width="125" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p3-mono" x="420" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Agentic Council</text></g>
    </g>
        <g class="p3-in p3-d2">
      <!-- Section label -->
      <text class="p3-mono" x="770" y="66" font-size="10.5" letter-spacing="2" fill="#438B6B">MULTI-MODEL DELIBERATION COUNCIL</text>

      <!-- Connecting flowing lines (Beziers converging to Consensus Synthesis) -->
      <path d="M 858 112 C 928 112, 955 182, 1012 182" fill="none" stroke="#287A60" stroke-opacity=".65" stroke-width="1.8"/>
      <path d="M 858 182 H 1012" fill="none" stroke="#438B6B" stroke-opacity=".85" stroke-width="1.8"/>
      <path d="M 858 252 C 928 252, 955 182, 1012 182" fill="none" stroke="#287A60" stroke-opacity=".45" stroke-width="1.8"/>

      <!-- Animated signal pulse travelling into consensus -->
      <circle r="4" fill="#E6F2EA" filter="url(#p3-glowf)">
        <animateMotion dur="2.8s" repeatCount="indefinite" path="M 858 182 H 1012"/>
      </circle>
      <circle r="3.5" fill="#A7D8BD" filter="url(#p3-glowf)">
        <animateMotion dur="3.4s" begin="0.8s" repeatCount="indefinite" path="M 858 112 C 928 112, 955 182, 1012 182"/>
      </circle>
      <circle r="3.5" fill="#A7D8BD" filter="url(#p3-glowf)">
        <animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite" path="M 858 252 C 928 252, 955 182, 1012 182"/>
      </circle>

      <!-- Left Input Model Nodes (Pills matching website Image 2) -->
      <g transform="translate(770 90)">
        <rect width="88" height="44" rx="22" fill="#0D1B14" stroke="#287A60" stroke-opacity=".6" stroke-width="1.3"/>
        <text class="p3-mono" x="44" y="27" text-anchor="middle" font-size="12" fill="#F3F6F1">GPT-4</text>
      </g>
      <g transform="translate(770 160)">
        <rect width="88" height="44" rx="22" fill="#0D1B14" stroke="#287A60" stroke-opacity=".6" stroke-width="1.3"/>
        <text class="p3-mono" x="44" y="27" text-anchor="middle" font-size="12" fill="#F3F6F1">Claude</text>
      </g>
      <g transform="translate(770 230)">
        <rect width="88" height="44" rx="22" fill="#0D1B14" stroke="#287A60" stroke-opacity=".6" stroke-width="1.3"/>
        <text class="p3-mono" x="44" y="27" text-anchor="middle" font-size="12" fill="#F3F6F1">Gemini</text>
      </g>

      <!-- Right Consensus Synthesis Node (Pill with glowing border) -->
      <g transform="translate(1012 158)">
        <rect width="158" height="48" rx="24" fill="#163326" stroke="#438B6B" stroke-width="1.6" filter="url(#p3-glowf)"/>
        <text class="p3-mono" x="79" y="30" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F3F6F1">Consensus Synthesis</text>
      </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#438B6B" stroke-opacity=".2"/>
    <rect class="p3-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p3-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

