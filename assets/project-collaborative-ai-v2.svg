      <text class="p3-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#f8f0f3">Collaborative AI</text>
      <text class="p3-sans" x="56" y="166" font-size="17" fill="#b6a3ac">Multi-LLM consensus platform orchestrating collaborative debate between leading models.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#e5b5c7"><tspan fill="#c77b9b">BUILT â€º</tspan> FastAPI async streaming, peer review arbitration, React live council UI</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#c77b9b" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#f8f0f3">3+ AGENTS</text><text class="p3-sans" y="24" font-size="12.5" fill="#b6a3ac">GPT-4, Claude, Gemini</text></g>
      <g transform="translate(261 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#f8f0f3">CONSENSUS</text><text class="p3-sans" y="24" font-size="12.5" fill="#b6a3ac">blind cross-model critique</text></g>
      <g transform="translate(466 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#f8f0f3">STREAMING</text><text class="p3-sans" y="24" font-size="12.5" fill="#b6a3ac">low-latency async responses</text></g>
      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="p3-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#e5b5c7">FastAPI</text></g>
      <g class="p3-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="65" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="p3-mono" x="166" y="331" text-anchor="middle" font-size="11.5" fill="#e5b5c7">Python</text></g>
      <g class="p3-chip" style="animation-delay:1.24s"><rect x="207" y="314" width="60" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="p3-mono" x="237" y="331" text-anchor="middle" font-size="11.5" fill="#e5b5c7">React</text></g>
      <g class="p3-chip" style="animation-delay:1.36s"><rect x="275" y="314" width="75" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="p3-mono" x="312" y="331" text-anchor="middle" font-size="11.5" fill="#e5b5c7">Firebase</text></g>
      <g class="p3-chip" style="animation-delay:1.48s"><rect x="358" y="314" width="125" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="p3-mono" x="420" y="331" text-anchor="middle" font-size="11.5" fill="#e5b5c7">Agentic Council</text></g>
    </g>
    <g class="p3-in p3-d2"><g transform="translate(0 35)">
      <g transform="translate(860 30)">
        <!-- Council orchestration visualization -->
        <g transform="translate(20 10)">
          <rect width="90" height="36" rx="8" fill="#27101c" stroke="#c77b9b" stroke-opacity=".3"/>
          <text class="p3-mono" x="45" y="22" text-anchor="middle" font-size="10" fill="#e5b5c7">GPT-4o</text>
        </g>
        <g transform="translate(140 10)">
          <rect width="90" height="36" rx="8" fill="#27101c" stroke="#c77b9b" stroke-opacity=".3"/>
          <text class="p3-mono" x="45" y="22" text-anchor="middle" font-size="10" fill="#e5b5c7">Claude 3.5</text>
        </g>
        <g transform="translate(80 70)">
          <rect width="90" height="36" rx="8" fill="#27101c" stroke="#c77b9b" stroke-opacity=".3"/>
          <text class="p3-mono" x="45" y="22" text-anchor="middle" font-size="10" fill="#e5b5c7">Gemini Pro</text>
        </g>

        <!-- Connecting lines -->
        <line x1="65" y1="46" x2="125" y2="150" stroke="#c77b9b" stroke-opacity=".4" stroke-dasharray="4 4"/>
        <line x1="185" y1="46" x2="125" y2="150" stroke="#c77b9b" stroke-opacity=".4" stroke-dasharray="4 4"/>
        <line x1="125" y1="106" x2="125" y2="150" stroke="#c77b9b" stroke-opacity=".4"/>

        <!-- Arbiter synthesis node -->
        <g transform="translate(45 150)">
          <rect width="160" height="60" rx="12" fill="#27101c" stroke="#c77b9b" stroke-width="1.5" filter="url(#p3-glowf)"/>
          <text class="p3-mono" x="80" y="24" text-anchor="middle" font-size="10" fill="#c77b9b">SYNTHESIS ARBITER</text>
          <text class="p3-serif" x="80" y="44" text-anchor="middle" font-size="13" fill="#f8f0f3">Unified Consensus</text>
