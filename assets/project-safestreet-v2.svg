<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Operation Evolve: Recursive self-evolving AI training architecture and autonomous optimization.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B14"/><stop offset="1" stop-color="#08110C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1F5A45" stop-opacity=".7"/><stop offset="1" stop-color="#08110C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#438B6B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p4-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F6F1"/><stop offset=".45" stop-color="#A7D8BD"/><stop offset="1" stop-color="#438B6B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: "Cinzel", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-chip { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-trace { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#438B6B">04 · AI RESEARCH · AUTONOMOUS SYSTEMS · REINFORCEMENT LEARNING</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F3F6F1">Operation Evolve</text>
      <text class="p4-sans" x="56" y="166" font-size="16.5" fill="#AABDB2">Autonomous architecture where models introspect on failures and iteratively self-tune.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#A7D8BD"><tspan fill="#438B6B">BUILT ›</tspan> Closed-loop experiment runner, error diagnostics, hyperparameter tuning</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#438B6B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p4-serif" font-size="25" font-weight="300" fill="#F3F6F1">AUTONOMOUS</text><text class="p4-sans" y="24" font-size="12.5" fill="#AABDB2">closed-loop training tuning</text></g>
      <g transform="translate(280 266)"><text class="p4-serif" font-size="25" font-weight="300" fill="#F3F6F1">INTROSPECT</text><text class="p4-sans" y="24" font-size="12.5" fill="#AABDB2">failure diagnosis &amp; rewrites</text></g>
      <g transform="translate(500 266)"><text class="p4-serif" font-size="25" font-weight="300" fill="#F3F6F1">EVOLUTION</text><text class="p4-sans" y="24" font-size="12.5" fill="#AABDB2">multi-generation policies</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="75" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p4-mono" x="93" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">PyTorch</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="139" y="314" width="65" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p4-mono" x="171" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Python</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="212" y="314" width="165" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p4-mono" x="294" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Reinforcement Learning</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="385" y="314" width="85" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p4-mono" x="427" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">AI Agents</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="478" y="314" width="115" height="26" rx="13" fill="#163326" stroke="#438B6B" stroke-opacity=".35"/><text class="p4-mono" x="535" y="331" text-anchor="middle" font-size="11.5" fill="#A7D8BD">Self-Evolving</text></g>
    </g>
    <g class="p4-in p4-d2">
      <!-- Section Title positioned neatly above the loop -->
      <text class="p4-mono" x="1010" y="66" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#438B6B">AUTONOMOUS TRAINING CYCLE</text>

      <!-- Circular Evolve Loop Visualization (shifted right to x=1010, radius 88) -->
      <g transform="translate(1010 190)">
        <!-- Rotating dashed orbit ring -->
        <circle r="88" fill="none" stroke="#287A60" stroke-opacity=".4" stroke-width="1.6" stroke-dasharray="5 5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Animated traveling particles along orbit -->
        <circle r="4" fill="#E6F2EA" filter="url(#p4-glowf)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="cx" values="88;88" dur="8s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#A7D8BD" filter="url(#p4-glowf)">
          <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="cx" values="88;88" dur="8s" repeatCount="indefinite"/>
        </circle>

        <!-- Orbit Stage Badges -->
        <!-- 01 Train (Top) -->
        <g transform="translate(0 -88)">
          <rect x="-38" y="-13" width="76" height="26" rx="13" fill="#0D1B14" stroke="#438B6B" stroke-opacity=".8" stroke-width="1.3"/>
          <text class="p4-mono" x="0" y="4" text-anchor="middle" font-size="10" fill="#A7D8BD">01 Train</text>
        </g>
        <!-- 02 Evaluate (Right) -->
        <g transform="translate(88 0)">
          <rect x="-46" y="-13" width="92" height="26" rx="13" fill="#0D1B14" stroke="#438B6B" stroke-opacity=".8" stroke-width="1.3"/>
          <text class="p4-mono" x="0" y="4" text-anchor="middle" font-size="10" fill="#A7D8BD">02 Evaluate</text>
        </g>
        <!-- 03 Rewrite (Bottom) -->
        <g transform="translate(0 88)">
          <rect x="-42" y="-13" width="84" height="26" rx="13" fill="#0D1B14" stroke="#438B6B" stroke-opacity=".8" stroke-width="1.3"/>
          <text class="p4-mono" x="0" y="4" text-anchor="middle" font-size="10" fill="#A7D8BD">03 Rewrite</text>
        </g>
        <!-- 04 Deploy (Left) -->
        <g transform="translate(-88 0)">
          <rect x="-40" y="-13" width="80" height="26" rx="13" fill="#0D1B14" stroke="#438B6B" stroke-opacity=".8" stroke-width="1.3"/>
          <text class="p4-mono" x="0" y="4" text-anchor="middle" font-size="10" fill="#A7D8BD">04 Deploy</text>
        </g>

        <!-- Center Hub with perfect text fit -->
        <circle r="44" fill="#163326" stroke="#438B6B" stroke-width="1.5" filter="url(#p4-glowf)"/>
        <text class="p4-mono" x="0" y="-4" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#438B6B">RECURSIVE</text>
        <text class="p4-mono" x="0" y="11" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="0.8" fill="#F3F6F1">EVOLVE LOOP</text>
      </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#438B6B" stroke-opacity=".2"/>
    <rect class="p4-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
